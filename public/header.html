<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KNNL Header</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    .header {
      background: linear-gradient(135deg, #0F766E 56%, #1CDCCD 86%);
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .header img {
      position: absolute;
      left: 20px;
      height: 70px;
      width: 70px;
      object-fit: contain;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
      text-align: center;
    }

    #menu-btn {
      position: absolute;
      right: 25px;
      font-size: 1.6rem;
      color: white;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #menu-btn:hover {
      transform: scale(1.1);
      color: #000;
    }

    @media(max-width: 600px) {
      .header img { width: 35px; height: 35px; }
      .header h1 { font-size: 1rem; }
      #menu-btn { right: 15px; font-size: 1.4rem; }
    }
  </style>
</head>

<body>
  <div class="header">
    <img src="./dept_logo1754559628.png" alt="Karnataka Emblem" />
    <h1>Karnataka Neeravari Nigam Limited</h1>
    <i class="fa-solid fa-bars" id="menu-btn"></i>
  </div>

  <div id="fullscreenIframeWrapper" style="
    display:none;
    position:fixed;
    top:0; left:0;
    width:100vw;
    height:100vh;
    background:white;
    z-index:99999999;">
  <iframe id="fullscreenIframe" style="width:100%; height:100%; border:none;"></iframe>
</div>
</body>
</html>
