    async function initDashboard() {

    const karnatakaBounds = [

    ];

    map = L.map("map", { attributionControl: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 10
    }).addTo(map);

    map.fitBounds(karnatakaBounds);

    const kRes = await fetch("karnataka.geojson");
    const kGeo = await kRes.json();
    L.geoJSON(kGeo, { style: { color: "#003366", weight: 2, fillOpacity: 0.05 } }).addTo(map);

    const dRes = await fetch("dams.geojson");
    const dGeo = await dRes.json();
    L.geoJSON(dGeo, {
      pointToLayer: (f, latlng) =>

          weight: 1,
          fillOpacity: 0.9
        }),
      onEachFeature: (f, layer) => {
        const damName = f.properties.Name;
        layer.bindTooltip(damName, {
  permanent: true,
  direction: "top",
  offset: [0, -5],
  className: "dam-label"  // custom style
});

        layer.on("click", (e) => {
          // 🧭 Smooth zoom to dam
          const lat = e.latlng.lat;
          const lng = e.latlng.lng;

          map.flyTo([lat, lng], 9, {
            duration: 1.2,
            easeLinearity: 0.25
          });

          // Update charts
          updateCharts(damName);
        });
      }
    }).addTo(map);

    updateCharts("all");
  } catch (err) {
    console.error("❌ Error initializing dashboard:", err);

    function safeNum(v) {
      return isNaN(parseFloat(v)) ? 0 : parseFloat(v);
    }

    function scrollToChart(chartId) {
  const chartCanvas = document.getElementById(chartId);
  if (!chartCanvas) return;

  const scrollParent = document.getElementById("charts-scroll");
  const card = chartCanvas.closest(".chart-box") || chartCanvas;

  const parentRect = scrollParent.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();

  // Current scroll position of the container
  const currentScrollTop = scrollParent.scrollTop;

  // How far the card is from the top of the container (in the viewport)
  const offsetFromParentTop = cardRect.top - parentRect.top;

  // Target scroll so that the card is vertically centered in the container
  const targetScrollTop =
    currentScrollTop +
    offsetFromParentTop -
    (scrollParent.clientHeight - card.offsetHeight) / 2;

  scrollParent.scrollTo({
    top: targetScrollTop,
    behavior: "smooth",
  });
}


    function resetDashboard() {
  // 1️⃣ Reset chart selection highlight or label
  document.getElementById("selectedDam").innerText = "";

  // 2️⃣ Reset map position
  map.fitBounds([
    [11.5, 74.0],
    [18.4, 78.5]
  ]);
  map.setZoom(7.3);

  // 3️⃣ Reset scroll position to top
  document.getElementById("charts-scroll").scrollTo({
    top: 0,
    behavior: "smooth"
  });

  // 4️⃣ Reset ALL charts back to full dataset mode
  updateCharts("all");

  // 5️⃣ Reset any active button styling (if future highlighting exists)
  document.querySelectorAll("#chartNav button").forEach(btn => btn.classList.remove("active"));
}

      const cumulativeOut = filtered.map(d => safeNum(d.CumulativeOutFlow));
      createOrUpdateChart("cumulativeFlowChart", "bar", names, [
        { label: "Cumulative Inflow", data: cumulativeIn, backgroundColor: "#ea801c" },
        { label: "Cumulative Outflow", data: cumulativeOut, backgroundColor: "#36A2EB" }
      ]);

      // Live Storage Comparison
      const minLive = filtered.map(d => safeNum(d.MinLiveStorage_TMC));
      const maxLive = filtered.map(d => safeNum(d.MaxLiveStorage_TMC));
      createOrUpdateChart("liveStorageChart", "bar", names, [
        { label: "Current Live Storage", data: liveStorage, backgroundColor: "#36A2EB" },
        { label: "Min Live Storage", data: minLive, backgroundColor: "#FFCE56" },
        { label: "Max Live Storage", data: maxLive, backgroundColor: "#FF6384" }
      ]);

      // Gross vs Design Capacity
      const designCap = filtered.map(d => safeNum(d.StorageCapacity_AsPerDesign));
      createOrUpdateChart("grossStorageChart", "bar", names, [
        { label: "Gross Storage", data: grossStorage, backgroundColor: "#36A2EB" },
        { label: "Design Capacity", data: designCap, backgroundColor: "#a00000" }
      ]);

      // Reservoir Level Comparison (Dual Ring)
      const presentLevel = filtered.map(d => safeNum(d.Reservior_Level));
      const fullLevel = filtered.map(d => safeNum(d.Full_Reservoir_Level));

      if (reservoirLevelChart) reservoirLevelChart.destroy();
     window["reservoirLevelChart"] = new Chart(document.getElementById("reservoirLevelChart"), {
        type: "doughnut",
        data: {
          labels: names,
          datasets: [
            {
              label: "Full Reservoir Level",
              data: fullLevel,
              backgroundColor: ["#36A2EB","#FF6384","#FFCE56","#4BC0C0","#9966FF","#FF9F40"],
              borderWidth: 1,
              cutout: "60%"
            },
            {
              label: "Present Level",
              data: presentLevel,
              backgroundColor: ["#64B5F6","#F06292","#FFF176","#80CBC4","#B39DDB","#FFB74D"],
              borderWidth: 1,
              cutout: "60%"
            }
          ]
        },
        options: {
         
          plugins: {
            title: {
              display: true,
              text: "Reservoir Levels (Inner: Present | Outer: Full)",
              font: { size: 10}
            },
            legend: {
              position: "right",
              labels: { font: { size: 8 }, boxWidth: 8}
            },
            datalabels: {
              color: "#000",
              font: { weight: "bold", size: 9 },
              formatter: v => (v ? v.toFixed(1) : "")+"TMC"
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    function createOrUpdateChart(id, type, labels, datasets) {
  const existing = Chart.getChart(id);
  if (existing) existing.destroy();

  const ctx = document.getElementById(id).getContext("2d");

  // 🔥 Create chart and expose it globally
  window[id] = new Chart(ctx, {
    type,
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        tooltip: {
          callbacks: {
            label: (context) => `${context.dataset.label}: ${context.raw} TMC`
          }
        },
        legend: { position: "bottom" },
        datalabels: {
          color: "#000",
          anchor: "end",
          align: "end",
          font: { size: 10, weight: "bold" },
          formatter: (v) => typeof v === "number" ? `${v.toFixed(1)} TMC` : v
        }
      },
      scales: type === "doughnut" ? {} : {
        y: {
          beginAtZero: true,
          ticks: { callback: val => `${val} TMC` }
        }
      }
    },
    plugins: [ChartDataLabels]
  });
}


  
  window.onload=initDashboard;

  fetch("./header.html")
  .then(res => res.text())
  .then(html => {
    console.log("HEADER CONTENT:", html);
    document.getElementById("header-placeholder").innerHTML = html;

    setTimeout(() => {
  const headerHeight = document.getElementById("header-placeholder").offsetHeight;
  document.getElementById("content-wrapper").style.marginTop = headerHeight + 10 + "px"; 
}, 200);
    // 🔥 After header loads, sidebar toggle finally works
    const menuBtn = document.getElementById("menu-btn");
    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content-wrapper");

    if (menuBtn) {
      menuBtn.addEventListener("click", () => {
        isOpen = !isOpen;
        sidebar.style.right = isOpen ? "0px" : "-240px";
        content.classList.toggle("sidebar-open", isOpen);
      });
    }

    window.addEventListener("message", (event) => {
  if (event.data.action === "closeFullscreen") {
    document.getElementById("fullscreenIframeWrapper").style.display = "none";
  }
});
  });
  </script>
