<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="year-finance-page">

  <!-- Dynamic Header -->
  <div id="header-placeholder"></div>

  <div id="sidebar" class="sidebar">
    <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="./WaterReserviors.html">Water Reservoirs</a>
    <a href="./lift_irrigation.html">Lift Irrigation</a>
    <a href="./Assest_inventory.html">Assest Inventory</a>
    <a href="./project_dash.html">Projects</a>
    <a href="./land_data.html">Land</a>
    <a href="./finance_year_data.html">Yearly Finance</a>
  </div>
  <h2>Year wise Financial Expenditure</h2>
  <!-- <div class="controls">
    <label for="yearSelect">Select Year for Month Chart:</label>
    <select id="yearSelect">
      <option>Loading...</option>
    </select>
  </div> -->
  <div id="content-wrapper">
    <div class="dashboard">
      <!-- <div class="card">
        <h3>Total Expenditure</h3>
        <div class="chart-container"><canvas id="fieldPie"></canvas></div>
      </div> -->

      <div class="card">
        <h3>Expenditure</h3>
        <div class="chart-container"><canvas id="fieldBar"></canvas></div>
      </div>

      <div class="card">
        <h3>Year-wise Expenditure</h3>
        <div class="chart-container"><canvas id="yearBar"></canvas></div>
      </div>

      <div class="card span-two">
        <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
          <h3 id="monthTitle">Month-wise Expenditure</h3>

          <select id="yearSelect"
            style="padding:6px 10px; font-size:14px; border-radius:6px; border:1px solid #ccc; min-width:120px;">
            <option>Loading...</option>
          </select>
        </div>

        <div class="chart-container">
          <canvas id="monthBar"></canvas>
        </div>
      </div>

      <div id="chartModal" class="chart-modal">
        <div class="chart-modal-content">

          <button id="closeModalBtn" class="close-btn">✕</button>
          <h3 id="modalChartTitle"></h3>

          <div class="modal-canvas-wrapper">
            <canvas id="modalChart"></canvas>
          </div>

        </div>
      </div>
    </div>
  </div>


  <script>
    let charts = {};
    let records = [];
    let monthsData = [];
    let isOpen = false;

    // Load financial data
    async function loadData() {
      try {
        const res = await fetch("/api/financial_year_data");
        const data = await res.json();
        records = data.records || [];
        monthsData = data.years || [];
        renderStaticCharts();
        populateYearSelect();
        const defaultYear = getDefaultYear();
        if (defaultYear) {
          renderMonthChart(defaultYear);
        }
      } catch (err) {
        console.error("Failed to load data:", err);
      }
    }

    // Render pie and bar charts
    function renderStaticCharts() {
      const fieldTotals = {};
      const yearTotals = {};

      records.forEach(r => {
        const field = r.field_name || r.roman_heading || 'Others';
        // year_value fallback to created year if not present
        const year = r.year_value || (r.month_year ? r.month_year.split("/").pop() : 'Unknown');
        const exp = Number(r.expenditure ?? r.total_value) || 0;
        fieldTotals[field] = (fieldTotals[field] || 0) + exp;
        yearTotals[year] = (yearTotals[year] || 0) + exp;
      });

      // destroy previous charts if present
      Object.values(charts).forEach(c => c?.destroy());

      // PIE CHART
      window["fieldPie"] = new Chart(document.getElementById("fieldPie"), {
        type: "pie",
        data: {
          labels: Object.keys(fieldTotals),
          datasets: [{
            data: Object.values(fieldTotals),
            backgroundColor: [
              "#FF9999", "#99BBFF", "#B6FFB6", "#D6C2FF", "#FFD9A6",
              "#FFC0CB", "#A0E7E5", "#FFB3BA",
              "#F4B942", "#7E6BC4", "#D6EAF8"
            ],
            borderColor: "#fff",
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: { top: 20, bottom: 40, left: 40 }
          },
          plugins: {
            legend: {
              display: true,
              position: "right",
              labels: { boxWidth: 8, font: { size: 11 } }
            },
            datalabels: {
              formatter: (value) => {

                if (value < 22000) return "";

                return value;
              },

              rotation: 90,
              anchor: "center",
              align: "center",
              offset: 0,

              clip: false,
              clamp: false,

              color: "#000",
              font: {
                size: 9,
                weight: "bold"
              }
            }


          },
        },
        plugins: [ChartDataLabels]
      });

      // FIELD BAR
      window["fieldBar"] = new Chart(
        document.getElementById("fieldBar"),
        {
          type: "bar",
          data: {
            labels: Object.keys(fieldTotals),
            datasets: [
              {
                label: "Expenditure",
                data: Object.values(fieldTotals),
                backgroundColor: "#A0E7E5",
                borderWidth: 0
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,

            // 🔥 CRITICAL: correct hover detection
            interaction: {
              mode: "nearest",
              axis: "x",
              intersect: false
            },

            hover: {
              mode: "nearest",
              axis: "x",
              intersect: false
            },

            layout: {
              padding: { top: 70, }
            },

            scales: {
              x: {
                offset: true,          
                ticks: {
                  maxRotation: 45,
                  minRotation: 45
                }
              },
              y: {
                min: 1000,
                beginAtZero: false,
                grace: "10%",
                title: {
                  display: true,
                  text: "Values in 1000 Cr"
                },
                ticks: {
                  callback: (value) => value / 1000
                }
              }
            },

            plugins: {
              legend: {
                display: false
              },

              tooltip: {
                enabled: true,
                position: "nearest",
                callbacks: {
                  title: (items) => items[0].label,
                  label: (context) => {
                    return (context.raw / 1000).toFixed(1);
                  }
                }
              },

              datalabels: {
                anchor: "end",
                align: "end",
                rotation: 90,
                clip: false,
                clamp: false,
                color: "#000",
                font: {
                  size: 12,
                  weight: "bold"
                },
                formatter: (value) =>
                  (value / 1000).toLocaleString("en-IN", {
                    minimumFractionDigits: 1,
                    maximumFractionDigits: 1
                  })
              }
            }
          },
          plugins: [ChartDataLabels]
        }
      );

      // YEAR LINE (same as before, with datalabels)
      window["yearBar"] = new Chart(
        document.getElementById("yearBar"),
        {
          type: "line",
          data: {
            labels: Object.keys(yearTotals),
            datasets: [{
              label: "Expenditure",
              data: Object.values(yearTotals),
              borderColor: "#FF6384",
              backgroundColor: "rgba(255,99,132,0.15)",
              tension: 0.4,

              pointRadius: 6,
              pointHoverRadius: 8,
              pointHitRadius: 6   
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,

            // 🔥 
            interaction: {
              mode: "nearest",
              intersect: true   // 👈 THIS IS THE KEY
            },

            hover: {
              mode: "nearest",
              intersect: true
            },

            plugins: {
              legend: { display: false },

              tooltip: {
                enabled: true,
                callbacks: {
                  title: (items) => items[0].label,
                  label: (ctx) => (ctx.parsed.y / 1000).toFixed(1)
                }
              },

              datalabels: {
                anchor: "end",
                align: "top",
                rotation: 90,
                font: { size: 10, weight: "bold" },
                formatter: (v) => (v / 1000).toFixed(1)
              }
            },

            scales: {
              x: {
                autoSkip: false,
                offset: false,
                ticks: {
                  maxRotation: 45,
                  minRotation: 45
                }
              },
              y: {
                beginAtZero: true,
                min: 0,
                grace: "10%",
                title: {
                  display: true,
                  text: "Values in 1000 Cr"
                },
                ticks: {
                  callback: (v) => v / 1000
                }
              }
            }
          },
          plugins: [ChartDataLabels]
        }
      );

    }

    // Populate year dropdown for month chart (shows unique years found in month_year)
    function populateYearSelect() {
      const yearSelect = document.getElementById("yearSelect");
      yearSelect.innerHTML = '';


      const years = [...new Set(monthsData
        .map(m => {
          if (!m.month_year) return null;
          const parts = String(m.month_year).split("/");
          return parts.length === 2 ? parts[1] : null;
        })
        .filter(Boolean)
      )].sort((a, b) => Number(a) - Number(b));

      if (years.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No years';
        yearSelect.appendChild(opt);
        return;
      }

      years.forEach(y => {
        const opt = document.createElement('option');
        opt.value = String(y);
        opt.textContent = String(y);
        yearSelect.appendChild(opt);
      });

      // default to last year
      yearSelect.value = years[years.length - 1];
      yearSelect.addEventListener('change', e => renderMonthChart(e.target.value));
    }


    let monthBarChart = null;

    function renderMonthChart(year) {

      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
        "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      const yearStr = String(year);

      const filtered = monthsData.filter(r => {
        const my = String(r.month_year);
        if (!my.includes("/")) return false;
        const [a, b] = my.split("/");
        return a.length === 4 ? a === yearStr : b === yearStr;
      });

      if (!filtered.length) {
        monthBarChart?.destroy();
        return;
      }

      filtered.forEach(r => {
        const [m, y] = r.month_year.split("/");
        r._month = Number(m.length === 4 ? y : m);
        r._value = Number(r.total_value) || 0;
      });

      const months = [...new Set(filtered.map(r => r._month))].sort((a, b) => a - b);
      const labels = months.map(m => monthNames[m - 1]);

      const categories = [...new Set(filtered.map(r => r.roman_heading))];

      const colors = categories.map((_, i) =>
        `hsl(${(i * 360) / categories.length}, 70%, 80%)`
      );

      const datasets = categories.map((cat, idx) => ({
        label: cat,
        stack: "combined",
        backgroundColor: colors[idx],
        data: months.map(m =>
          filtered
            .filter(r => r._month === m && r.roman_heading === cat)
            .reduce((s, r) => s + r._value, 0)
        )
      }));

      monthBarChart?.destroy();

      window["monthBar"] = monthBarChart = new Chart(
        document.getElementById("monthBar"), {
        type: "bar",
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { stacked: true },
            y: {
              stacked: true,
              title: {
                display: true,
                text: 'Values in 1000 Cr',
              },
              ticks: {
                callback: (value) => value / 1000
              }
            }
          },
          plugins: {
            datalabels: {
              formatter: (v, ctx) => {
                if (!v) return "";

                const total = ctx.chart.data.datasets
                  .reduce((s, d) => s + (d.data[ctx.dataIndex] || 0), 0);

                if (v / total < 0.05) return "";

                return (v / 1000).toFixed(1);
              }
            },
            tooltip: {
              callbacks: {
                label: function (context) {
                  let value = context.raw; // original value
                  return (value / 1000).toFixed(1); // divide by 1000
                }
              }
            }
          }
        },
        plugins: [ChartDataLabels]
      });

    }


    function getDefaultYear() {
      // pick the last available year from monthsData
      const years = [...new Set((monthsData || []).map(m => {
        if (!m.month_year) return null;
        const p = String(m.month_year).split("/");
        return p.length === 2 ? p[1] : null;
      }).filter(Boolean))].sort((a, b) => Number(a) - Number(b));
      return years[years.length - 1] || '';
    }

    // Load dynamic header from external file (optional)
    fetch("header.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("header-placeholder").innerHTML = html;


        const menuBtn = document.getElementById("menu-btn");
        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("content-wrapper");

        if (menuBtn) {
          menuBtn.addEventListener("click", () => {
            isOpen = !isOpen;
            sidebar.style.right = isOpen ? "0px" : "-240px";
            content.classList.toggle("sidebar-open", isOpen);
          });
        }

        window.addEventListener("message", (event) => {
          if (event.data.action === "closeFullscreen") {
            document.getElementById("fullscreenIframeWrapper").style.display = "none";
          }
        });
      });

    let modalChartInstance = null;

    function enableModal(chartId, title) {
      const canvas = document.getElementById(chartId);
      if (!canvas) return;

      canvas.style.cursor = "pointer";

      canvas.onclick = () => {
        const original = window[chartId];
        if (!original) return;

        document.getElementById("chartModal").style.display = "flex";
        document.getElementById("modalChartTitle").innerText = title;

        if (modalChartInstance) modalChartInstance.destroy();

        const modalCanvas = document.getElementById("modalChart");
        modalCanvas.getContext("2d").canvas._chart = undefined;

        const cloneData = {
  labels: [...original.data.labels],
  datasets: original.data.datasets.map(ds => ({
    label: ds.label,
    data: ds.data.map(v => Number(v)),

    
    borderColor: ds.borderColor,
    backgroundColor: ds.backgroundColor,
    pointBackgroundColor: ds.pointBackgroundColor || ds.borderColor,
    pointBorderColor: ds.pointBorderColor || ds.borderColor,
    borderWidth: ds.borderWidth || 2,
    tension: ds.tension,
    fill: ds.fill ?? false
  }))
};


        const clonedOptions = JSON.parse(JSON.stringify(original.config.options));

        // Reattach tick callback to divide by 1000
        if (original.config.options.scales?.y?.ticks?.callback) {
          clonedOptions.scales.y.ticks.callback = original.config.options.scales.y.ticks.callback;
        }

        // Reattach Y-axis title
        if (original.config.options.scales?.y?.title) {
          clonedOptions.scales.y.title = original.config.options.scales.y.title;
        }

        // Reattach datalabels formatter if needed
        if (clonedOptions.plugins?.datalabels) {
          const originalFormatter = clonedOptions.plugins.datalabels.formatter;
          clonedOptions.plugins.datalabels.formatter = function (value, context) {
            // Only apply for monthBar chart
            if (chartId === "monthBar") {
              const total = context.chart.data.datasets[0].data.reduce((sum, v) => sum + v, 0);
              if (value / total < 0.01) return "";
            }

            // Keep original formatting if it exists
            if (originalFormatter) {
              return originalFormatter(value, context);
            }

            // Default behavior: divide by 1000 and 1 decimal
            return (value / 1000).toFixed(1);
          };
        }



        modalChartInstance = new Chart(
          document.getElementById("modalChart"), {
          type: original.config.type,
          data: cloneData,
          options: {
            ...clonedOptions,
            plugins: {
              ...clonedOptions.plugins,
              tooltip: {
                ...clonedOptions.plugins.tooltip,
                callbacks: {
                  label: function (context) {
                    let value = context.raw;
                    return (value / 1000).toFixed(1);
                  }
                }
              }
            }
          },
          plugins: [ChartDataLabels] // keep the plugin active
        }
        );



        setTimeout(() => modalChartInstance.resize(), 150);
      };
    }

    document.getElementById("closeModalBtn").onclick = () => {
      document.getElementById("chartModal").style.display = "none";
    };



    // start
    loadData();
    setTimeout(() => {
      enableModal("fieldPie", "Field-wise Total Expenditure");
      enableModal("fieldBar", "Field-wise Expenditure");
      enableModal("yearBar", "Year-wise Expenditure");
      enableModal("monthBar", "Month-wise Expenditure");
    }, 800);

  </script>

</body>

</html>
