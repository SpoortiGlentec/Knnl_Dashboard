<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>KNNL 3D Map + Land Area Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>



  <link rel="stylesheet" href="style.css">
</head>

<body class="land-page">

  <div id="header-placeholder"></div>

  <div id="sidebar" class="sidebar">
    <a href="index.html">Home</a>
    <a href="WaterReserviors.html">Water Reservoirs</a>
    <a href="lift_irrigation.html">Lift Irrigation</a>
    <a href="finance.html">Finance</a>
    <a href="project_dash.html">Projects</a>
    <a href="land_data.html">Land</a>
    <a href="finance_year_data.html">Yearly Finance</a>
  </div>

  <div id="content-wrapper">
    <h2>Zone & Project Area Dashboard</h2>
    <div class="container">

      <div id="map">
        <div id="mapLegend"></div>
        <button id="resetMapBtn">Reset View</button>
      </div>




      <div class="card">
        <h3 id="chartTitle">Zone-wise Total Area (Acre)</h3>

        <div class="chart-wrapper">
          <canvas id="areaChart"></canvas>
        </div>

        <button id="backBtn">⬅ Back to All Zones</button>
      </div>




    </div>
  </div>

  <!-- POPUP TABLE -->
  <div id="dataPopup" style="
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.4); z-index:3000;
  justify-content:center; align-items:center;">

    <div style="
    background:white; padding:15px;
    width:380px; border-radius:8px;
    max-height:80vh; overflow-y:auto;">

      <button id="closePopup" style="float:right;background:red;color:white;
             border:none;padding:6px 10px;cursor:pointer;">
        X
      </button>

      <h3 id="popupTitle"></h3>
      <table id="popupTable" style="width:100%;border-collapse:collapse;"></table>
    </div>
  </div>

  <script>
    /* ----------------------------------------
       GLOBALS
    -----------------------------------------*/
    const areaChartElem = document.getElementById("areaChart");

    const zoneNameMap = {
      "Belagavi": "Belagavi zone",
      "Dharwad": "Dharwad zone",
      "Munirabad": "Munirabad zone",
      "Shimogga": "Shivamogga zone",
      "Kalaburgi": "Kalaburagi zone"
    };

    const zoneColors = {
      "Belagavi zone": "#3498db",
      "Dharwad zone": "#e67e22",
      "Munirabad zone": "#9b59b6",
      "Shivamogga zone": "#1abc9c",
      "Kalaburagi zone": "#e74c3c"
    };

    let projectData = [];
    let areaChart = null;
    const PROJECT_API = "/api/prjct_land_info";

    /* ----------------------------------------
       POPUP
    -----------------------------------------*/
    function showPopup(zone) {

      const filtered = projectData.filter(r => r.zone_name === zone);
      const table = document.getElementById("popupTable");
      const title = document.getElementById("popupTitle");

      title.textContent = `${zone} – Project List`;

      table.innerHTML = `
    <tr style="background:#f4f4f4">
      <th style="border:1px solid #ddd;padding:4px;">Project</th>
      <th style="border:1px solid #ddd;padding:4px;">Acre</th>
     
    </tr>
  `;

      filtered.forEach(r => {
        const projName = String(r.project_name || "");
        const gunta = String(r.total_area_gunta || "");

        const totalAcres =
          (Number(r.total_area_acre) || 0) +
          ((Number(r.total_area_gunta) || 0) / 40);

        table.innerHTML += `
      <tr>
        <td>${projName}</td>
        <td>${totalAcres.toFixed(2)}</td>
      
      </tr>
    `;
      });

      document.getElementById("dataPopup").style.display = "flex";
    }

    document.getElementById("closePopup").onclick = () => {
      document.getElementById("dataPopup").style.display = "none";
    };

    /* ----------------------------------------
       FETCH DATA
    -----------------------------------------*/
    (async function init() {
      const res = await fetch(PROJECT_API);
      projectData = await res.json();

      renderZoneChart();
    })();

    /* ----------------------------------------
       CHART HELPERS
    -----------------------------------------*/
    function destroyChart() {
      if (areaChart) areaChart.destroy();
    }

    function asNumber(v) {
      return Number(String(v || 0).replace(/,/g, "")) || 0;
    }

    /* ----------------------------------------
       ZONE DONUT CHART
    -----------------------------------------*/
    function renderZoneChart() {
      destroyChart();
      const totals = {};

      projectData.forEach(r => {
        const acre = Number(r.total_area_acre) || 0;
        const gunta = Number(r.total_area_gunta) || 0;

        const totalAcres = acre + (gunta / 40);

        if (!totals[r.zone_name]) totals[r.zone_name] = 0;

        totals[r.zone_name] += totalAcres;
      });


      areaChart = new Chart(areaChartElem, {
        type: "doughnut",

        data: {
          labels: Object.keys(totals),
          datasets: [{
            data: Object.values(totals),
            backgroundColor: ["#4BC0C0", "#FF6384", "#FFCE56", "#36A2EB", "#9966FF"]
          }]
        },

        options: {
          responsive: true,
          maintainAspectRatio: false,

          plugins: {
            legend: {
              position: 'top',
              align: 'center',
              labels: {
                boxWidth: 15,
                padding: 10,
                color: '#333',
                font: { size: 12, weight: 'bold' }
              }
            },

            datalabels: {
              color: '#fff',
              font: { weight: 'bold', size: 14 },
              anchor: 'center',
              align: 'center',
              formatter: (v) => v.toFixed(2)

            }
          }
        },

        plugins: [ChartDataLabels]
      });


      document.getElementById("backBtn").style.display = "none";
    }

    /* ----------------------------------------
       BACK BUTTON
    -----------------------------------------*/
    document.getElementById("backBtn").onclick = () => {
      renderZoneChart();
      document.getElementById("dataPopup").style.display = "none";
      document.getElementById("backBtn").style.display = "none";
    };

    /* ----------------------------------------
       MAP
    -----------------------------------------*/
    const map = new maplibregl.Map({
      container: "map",
      style: "https://demotiles.maplibre.org/style.json",
      center: [75.7, 15.3],
      zoom: 6.8
    });
    const hoverPopup = new maplibregl.Popup({
      closeButton: false,
      closeOnClick: false
    });


    map.on("load", async () => {

      const districts = await (await fetch("Karnataka.geojson")).json();
      map.addSource("districts", { type: "geojson", data: districts });

      map.addLayer({
        id: "districts-outline",
        type: "line",
        source: "districts",
        paint: { "line-color": "#444", "line-width": 1.4 }
      });

      const zonesGeo = await (await fetch("KNNL_Zones.geojson")).json();

      zonesGeo.features.forEach(f => {
        f.properties.color =
          zoneColors[f.properties.zone_name] || "#aaa";
      });

      map.addSource("zones", { type: "geojson", data: zonesGeo });

      map.addLayer({
        id: "zones-fill",
        type: "fill",
        source: "zones",
        paint: {
          "fill-color": ["get", "color"],
          "fill-opacity": 0.65
        }
      });
      /* SHOW ZONE NAME ON HOVER */
      map.on("mousemove", "zones-fill", (e) => {
        const zoneName = e.features[0].properties.zone_name;

        hoverPopup
          .setLngLat(e.lngLat)
          .setHTML(`<div style="font-size:14px;font-weight:600;">${zoneName}</div>`)
          .addTo(map);
      });

      map.on("mouseleave", "zones-fill", () => {
        hoverPopup.remove();
      });

      /* CLICK ON ZONE */
      map.on("click", "zones-fill", (e) => {

        const geoName = e.features[0].properties.zone_name;

        const apiZone = Object.keys(zoneNameMap)
          .find(z => zoneNameMap[z] === geoName);

        if (!apiZone) return;

        /* Always stay on ZONE chart */
        renderZoneChart();

        /* Show projects below */
        showPopup(apiZone);

        /* SHOW BACK BUTTON */
        document.getElementById("backBtn").style.display = "block";


        /* HIGHLIGHT COLORS FIX */
        setTimeout(() => {
          const labels = areaChart.data.labels;
          const colors = [];

          labels.forEach(label => {
            const mapped = zoneNameMap[label] || label;
            const c = zoneColors[mapped] || "#cccccc";

            if (mapped === zoneNameMap[apiZone]) {
              colors.push(c); // highlight selected
            } else {
              const r = parseInt(c.substring(1, 3), 16);
              const g = parseInt(c.substring(3, 5), 16);
              const b = parseInt(c.substring(5, 7), 16);
              colors.push(`rgba(${r},${g},${b},0.25)`); // dim others
            }
          });

          areaChart.data.datasets[0].backgroundColor = colors;
          areaChart.update();
        }, 200);
      });
    });

    /* ----------------------------------------
       RESET BUTTON
    -----------------------------------------*/
    document.getElementById("resetMapBtn").onclick = () => {

      // Reset chart to full zones
      renderZoneChart();

      // Close popup if open
      document.getElementById("dataPopup").style.display = "none";
      document.getElementById("backBtn").style.display = "none";

      // Reset map view WITHOUT zoom animation
      map.jumpTo({
        center: [75.7, 15.3],
        zoom: 6.8,
        pitch: 0,
        bearing: 0
      });
    };
    fetch("header.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("header-placeholder").innerHTML = html;

        //sidebar toggle
        let isOpen = false;

        const menuBtn = document.getElementById("menu-btn");
        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("content-wrapper");

        // Toggle sidebar using the menu button
        menuBtn.addEventListener("click", (event) => {
          event.stopPropagation(); // Prevent click from closing it immediately
          isOpen = !isOpen;
          sidebar.style.right = isOpen ? "0px" : "-240px";
          content.classList.toggle("sidebar-open", isOpen);
        });

        // Close sidebar when clicking anywhere outside
        document.addEventListener("click", (event) => {
          if (
            isOpen &&
            !sidebar.contains(event.target) &&
            !menuBtn.contains(event.target)
          ) {
            isOpen = false;
            sidebar.style.right = "-240px";
            content.classList.remove("sidebar-open");
          }
        });

      });

  </script>
</body>

</html>
