<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>KNNL Land Area Dashboard (Leaflet)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body class="land-page">

  <div id="header-placeholder"></div>

  <div id="sidebar" class="sidebar">
    <a href="index.html">Home</a>
    <a href="WaterReserviors.html">Water Reservoirs</a>
    <a href="lift_irrigation.html">Lift Irrigation</a>
    <a href="./Assest_inventory.html">Asset Inventory</a>
    <a href="project_dash.html">Projects</a>
    <a href="land_data.html">Land</a>
    <a href="finance_year_data.html">Yearly Finance</a>
  </div>

  <div id="content-wrapper">
    <h2>Zone & Project Area Dashboard</h2>

    <div class="container">

      <div id="map">
        <button id="resetMapBtn">Reset View</button>
      </div>

      <div class="card">
        <h3>Zone-wise Total Area (Acre)</h3>
        <div class="chart-wrapper">
          <canvas id="areaChart"></canvas>
        </div>
        <button id="backBtn">⬅ Back to All Zones</button>
      </div>

    </div>
  </div>

  <!-- POPUP -->
  <div id="dataPopup" style="display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.4); z-index:3000;
    justify-content:center; align-items:center;">

    <div style="background:white; padding:15px; width:380px;
      border-radius:8px; max-height:80vh; overflow-y:auto;">

      <button id="closePopup"
        style="float:right;background:red;color:white;border:none;padding:6px 10px;">
        X
      </button>

      <h3 id="popupTitle"></h3>
      <table id="popupTable" style="width:100%;border-collapse:collapse;"></table>
    </div>
  </div>

  <script>
    const areaChartElem = document.getElementById("areaChart");

    const zoneNameMap = {
      "Belagavi": "Belagavi zone",
      "Dharwad": "Dharwad zone",
      "Munirabad": "Munirabad zone",
      "Shimogga": "Shivamogga zone",
      "Kalaburgi": "Kalaburagi zone"
    };

    const zoneColors = {
      "Belagavi zone": "#3498db",
      "Dharwad zone": "#e67e22",
      "Munirabad zone": "#9b59b6",
      "Shivamogga zone": "#1abc9c",
      "Kalaburagi zone": "#e74c3c"
    };

    function getZoneColorByApiZone(apiZone) {
      return zoneColors[zoneNameMap[apiZone]] || "#aaa";
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.substring(1, 3), 16);
      const g = parseInt(hex.substring(3, 5), 16);
      const b = parseInt(hex.substring(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    let projectData = [];
    let areaChart = null;
    let zoneLayer;
    let map;

    const PROJECT_API = "/api/prjct_land_info";

    function showPopup(zone) {
      const filtered = projectData.filter(r => r.zone_name === zone);
      const table = document.getElementById("popupTable");

      document.getElementById("popupTitle").textContent =
        `${zone} – Project List`;

      table.innerHTML = `
        <tr style="background:#f4f4f4">
          <th>Project</th>
          <th>Acre</th>
        </tr>`;

      filtered.forEach(r => {
        const acres =
          (Number(r.total_area_acre) || 0) +
          ((Number(r.total_area_gunta) || 0) / 40);

        table.innerHTML += `
          <tr>
            <td>${r.project_name}</td>
            <td>${acres.toFixed(2)}</td>
          </tr>`;
      });

      document.getElementById("dataPopup").style.display = "flex";
    }

    document.getElementById("closePopup").onclick = () =>
      document.getElementById("dataPopup").style.display = "none";

    function destroyChart() {
      if (areaChart) areaChart.destroy();
    }

    function renderZoneChart() {
      destroyChart();

      const totals = {};
      projectData.forEach(r => {
        const acres =
          (Number(r.total_area_acre) || 0) +
          ((Number(r.total_area_gunta) || 0) / 40);
        totals[r.zone_name] = (totals[r.zone_name] || 0) + acres;
      });

      areaChart = new Chart(areaChartElem, {
        type: "doughnut",
        data: {
          labels: Object.keys(totals),
          datasets: [{
            data: Object.values(totals),
            backgroundColor: Object.keys(totals).map(z =>
              getZoneColorByApiZone(z)
            )
          }]
        },
        options: {
          onClick: (evt, el) => {
            if (!el.length) return;
            applyZoneSelection(areaChart.data.labels[el[0].index]);
          },
          plugins: {
            datalabels: {
              color: "#fff",
              font: { weight: "bold" },
              formatter: v => v.toFixed(2)
            }
          }
        },
        plugins: [ChartDataLabels]
      });

      document.getElementById("backBtn").style.display = "none";
    }

    function applyZoneSelection(apiZone) {
      showPopup(apiZone);
      document.getElementById("backBtn").style.display = "block";

      areaChart.data.datasets[0].backgroundColor =
        areaChart.data.labels.map(l =>
          l === apiZone
            ? getZoneColorByApiZone(l)
            : hexToRgba(getZoneColorByApiZone(l), 0.55)
        );
      areaChart.update();

      zoneLayer.eachLayer(layer => {
        const geoName = layer.feature.properties.zone_name;
        const selectedGeo = zoneNameMap[apiZone];
        layer.setStyle({
          fillOpacity: geoName === selectedGeo ? 0.85 : 0.75
        });
      });
    }

    document.getElementById("backBtn").onclick = () => {
      renderZoneChart();
      document.getElementById("dataPopup").style.display = "none";
      document.getElementById("backBtn").style.display = "none";

      zoneLayer.eachLayer(layer =>
        layer.setStyle({ fillOpacity: 0.85 })
      );

      map.setView([15.3, 75.7], 7);
    };

    map = L.map("map",{attributionControl: false }).setView([15.3, 75.7], 7);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

    (async () => {
      const zonesGeo = await fetch("KNNL_Zones.geojson").then(r => r.json());

      zoneLayer = L.geoJSON(zonesGeo, {
        style: f => ({
          fillColor: zoneColors[f.properties.zone_name],
          fillOpacity: 0.85,
          color: "#333",
          weight: 1
        }),
        onEachFeature: (f, layer) => {
          layer.bindTooltip(f.properties.zone_name);
          layer.on("click", () => {
            const apiZone = Object.keys(zoneNameMap)
              .find(z => zoneNameMap[z] === f.properties.zone_name);
            if (apiZone) applyZoneSelection(apiZone);
          });
        }
      }).addTo(map);
    })();

    document.getElementById("resetMapBtn").onclick = () => {
      renderZoneChart();
      document.getElementById("dataPopup").style.display = "none";
      document.getElementById("backBtn").style.display = "none";

      zoneLayer.eachLayer(layer =>
        layer.setStyle({ fillOpacity: 0.85 })
      );

      map.setView([15.3, 75.7], 7);
    };

   fetch("header.html")
  .then(res => res.text())
  .then(html => {
    document.getElementById("header-placeholder").innerHTML = html;

    let isOpen = false; // ✅ FIX 1: declare state

    const menuBtn = document.getElementById("menu-btn");
    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content-wrapper");

    if (menuBtn && sidebar) {
      menuBtn.addEventListener("click", (e) => {
        e.stopPropagation(); // ✅ FIX 2: prevent instant close

        isOpen = !isOpen;
        sidebar.style.right = isOpen ? "0px" : "-240px";
        content.classList.toggle("sidebar-open", isOpen);
      });
    }

    // ✅ Click outside to close sidebar
    document.addEventListener("click", (e) => {
      if (
        isOpen &&
        !sidebar.contains(e.target) &&
        !menuBtn.contains(e.target)
      ) {
        isOpen = false;
        sidebar.style.right = "-240px";
        content.classList.remove("sidebar-open");
      }
    });

    // Your existing listener (unchanged)
    window.addEventListener("message", (event) => {
      if (event.data?.action === "closeFullscreen") {
        const fs = document.getElementById("fullscreenIframeWrapper");
        if (fs) fs.style.display = "none";
      }
    });
  });

    (async () => {
      projectData = await fetch(PROJECT_API).then(r => r.json());
      renderZoneChart();
    })();
  </script>

</body>
</html>
