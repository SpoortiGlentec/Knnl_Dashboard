<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KNNL 3D Map + Land Area Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="stylesheet" href="style.css">
</head>


<body class="land-page">
<div id="header-placeholder"></div>

<div id="sidebar" class="sidebar">
  <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
  <a href="./WaterReserviors.html">Water Reservoirs</a>
  <a href="./lift_irrigation.html">Lift Irrigation</a>
  <a href="./finance.html">Finance</a>
  <a href="./project_dash.html">Projects</a>
  <a href="./land_data.html">Land</a>
  <a href="./finance_year_data.html">Yearly Finance</a>
</div>
<div id="content-wrapper">
<div class="container">
  <div id="map">
    <div id="mapLegend" class="map-legend"></div>
    <button id="resetMapBtn" class="reset-map-btn">Reset View</button>
  </div>

  <div id="right-panel">
    
    <h2>Zone & Project Area Dashboard</h2>

    <div class="controls">
      <select id="zoneSelect">
        <option value="all">All Zones</option>
      </select>

      <select id="projectSelect">
        <option value="all">All Projects</option>
      </select>
    </div>

    <div class="card">
      <h3 id="chartTitle">Zone-wise Total Area (Acre)</h3>
      <canvas id="areaChart" height="250"></canvas>
      <button id="backBtn">⬅ Back to All Zones</button>
    </div>
  </div>
  <div id="chartModal" class="chart-modal">
  <div class="chart-modal-content">

    <button id="closeModalBtn" class="close-btn">✕ Close</button>
    <h3 id="modalChartTitle"></h3>

    <div class="modal-canvas-wrapper">
      <canvas id="modalChart"></canvas>
    </div>
  </div>
</div>
</div>
</div>


<script>
// ----------------------------------------
// GLOBAL FIX
// ----------------------------------------
const areaChartElem = document.getElementById("areaChart");

// ----------------------------------------
// CORRECT API → GEOJSON ZONE MAPPING
// ----------------------------------------
const zoneNameMap = {
  "Belagavi": "Belagavi zone",
  "Dharwad": "Dharwad zone",
  "Munirabad": "Munirabad zone",
  "Shimogga": "Shivamogga zone",
  "Kalaburgi": "Kalaburagi zone"
};

// Colors for zones
const zoneColors = {
  "Belagavi zone": "#3498db",
  "Dharwad zone": "#e67e22",
  "Munirabad zone": "#9b59b6",
  "Shivamogga zone": "#1abc9c",
  "Kalaburagi zone": "#e74c3c"
};

// ----------------------------------------
// LOAD PROJECT DATA
// ----------------------------------------
let projectData = [];
let isOpen = false;
const PROJECT_API = "/api/prjct_land_info";

(async function init() {
  const res = await fetch(PROJECT_API);
  projectData = await res.json();

  populateZoneDropdown();
  renderZoneChart();
})();

// ----------------------------------------
// CHART FUNCTIONS
// ----------------------------------------
let areaChart = null;

function destroyChart() {
  if (areaChart) areaChart.destroy();
}

function asNumber(v) {
  return Number(String(v || 0).replace(/,/g, "")) || 0;
}

function populateZoneDropdown() {
  const zoneSelect = document.getElementById("zoneSelect");
  const zones = [...new Set(projectData.map(r => r.zone_name))];

  zones.forEach(z => {
    const opt = document.createElement("option");
    opt.value = z;
    opt.textContent = z;
    zoneSelect.appendChild(opt);
  });

  zoneSelect.addEventListener("change", () => {
    const z = zoneSelect.value;
    resetProjectDropdown();

    if (z === "all") {
      flyToWholeState();
      renderZoneChart();
      return;
    }

    populateProjects(z);
    highlightZone(z);
    renderProjectChart(z);
  });
}

function resetProjectDropdown() {
  const projectSelect = document.getElementById("projectSelect");
  projectSelect.innerHTML = "<option value='all'>All Projects</option>";
}

function populateProjects(zone) {
  const projectSelect = document.getElementById("projectSelect");
  const filtered = projectData.filter(r => r.zone_name === zone);

  const projects = [...new Set(filtered.map(r => r.project_name))];
  projects.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    projectSelect.appendChild(opt);
  });
}

document.getElementById("projectSelect").addEventListener("change", () => {
  const zone = document.getElementById("zoneSelect").value;
  const proj = document.getElementById("projectSelect").value;

  if (proj === "all") return renderProjectChart(zone);
  renderSingleProject(zone, proj);
});

function renderZoneChart() {
  destroyChart();
  document.getElementById("chartTitle").textContent = "Zone-wise Total Area (Acre)";
  document.getElementById("backBtn").style.display = "none";

  const zoneTotals = {};
  projectData.forEach(r => zoneTotals[r.zone_name] = r.zone_total_acre);

  window["areaChart"] = new Chart(areaChartElem, {
    type: "doughnut",
    data: {
      labels: Object.keys(zoneTotals),
      datasets: [{ data: Object.values(zoneTotals) }]
    }
  });
}

function renderProjectChart(zone) {
  destroyChart();
  document.getElementById("chartTitle").textContent = `${zone} – Project-wise Area`;
  document.getElementById("backBtn").style.display = "block";

  const filtered = projectData.filter(r => r.zone_name === zone);
  const projTotals = {};

  filtered.forEach(r => {
    projTotals[r.project_name] =
      (asNumber(r.total_area_acre) + asNumber(r.total_area_gunta) / 40);
  });

  window["donutChart"] = new Chart(document.getElementById("donutChart"), {
  type: "doughnut",
  data: {
    labels: zones,
    datasets: [{
      label: "Projects by Zone",
      data: donutValues,
      backgroundColor: colorPalette
    }]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: 'top',
        align: 'center',
        labels: {
          boxWidth: 15,
          padding: 10,
          color: '#333',
          font: { size: 12, weight: 'bold' }
        }
      },
      datalabels: {
        color: '#fff',
        font: { weight: 'bold', size: 14 },
        formatter: (value) => value + " Cr" // OPTIONAL
      }
    }
  },
  plugins: [ChartDataLabels]
}); 
}

function renderSingleProject(zone, project) {
  destroyChart();
  const filtered = projectData.filter(r => r.zone_name === zone && r.project_name === project);

  const total = filtered.reduce((sum, r) =>
    sum + asNumber(r.total_area_acre) + asNumber(r.total_area_gunta) / 40, 0
  );

  document.getElementById("chartTitle").textContent = `${project} (${zone})`;

  window ["areaChart"] = new Chart(areaChartElem, {
    type: "doughnut",
    data: { labels: [project], datasets: [{ data: [total] }] }
  });
}

document.getElementById("backBtn").onclick = () => {
  document.getElementById("zoneSelect").value = "all";
  resetProjectDropdown();
  flyToWholeState();
  renderZoneChart();
};

// ----------------------------------------
// MAP SETUP
// ----------------------------------------
const map = new maplibregl.Map({
  container: "map",
  style: "https://demotiles.maplibre.org/style.json",
  center: [75.7, 15.3],
  zoom: 6.8,
  pitch: 55,
  bearing: -20
});

let zonesGeo = null;

map.on("load", async () => {
  const districts = await (await fetch("Karnataka.geojson")).json();
  map.addSource("districts", { type: "geojson", data: districts });
  map.addLayer({
    id: "districts",
    type: "line",
    source: "districts",
    paint: { "line-color": "#666", "line-width": 1 }
  });

  zonesGeo = await (await fetch("KNNL_Zones.geojson")).json();

  zonesGeo.features.forEach(f => {
    f.properties.color = zoneColors[f.properties.zone_name] || "#888";
    f.properties.height = 2000;
  });

  map.addSource("zones", { type: "geojson", data: zonesGeo });

  map.addLayer({
    id: "zones-3d",
    type: "fill-extrusion",
    source: "zones",
    
    paint: {
      "fill-extrusion-color": ["get", "color"],
      "fill-extrusion-height": ["get", "height"],
      "fill-extrusion-opacity": 0.85
    }
  });

  map.on("click", "zones-3d", (e) => {
    const geoName = e.features[0].properties.zone_name;

    const apiZone = Object.keys(zoneNameMap)
      .find(api => zoneNameMap[api] === geoName);

    if (!apiZone) return;

    document.getElementById("zoneSelect").value = apiZone;

    resetProjectDropdown();
    populateProjects(apiZone);
    highlightZone(apiZone);
    renderProjectChart(apiZone);
  });

  let popup = new maplibregl.Popup({
    closeButton: false,
    closeOnClick: false
});

map.on("mousemove", "zones-3d", (e) => {
    if (!e.features.length) return;

    const zoneName = e.features[0].properties.zone_name;

    popup
      .setLngLat(e.lngLat)
      .setHTML(`<b>${zoneName}</b>`)
      .addTo(map);
});

map.on("mouseleave", "zones-3d", () => {
    popup.remove();
});
});


function highlightZone(apiZone) {
  const geoName = zoneNameMap[apiZone];
  const feature = zonesGeo.features.find(f => f.properties.zone_name === geoName);

  if (!feature) return;

  let coords;

  if (feature.geometry.type === "Polygon") {
      coords = feature.geometry.coordinates[0];
  } else if (feature.geometry.type === "MultiPolygon") {
      coords = feature.geometry.coordinates[0][0];
  }

  let minX = Infinity, 
      minY = Infinity, 
      maxX = -Infinity, 
      maxY = -Infinity;

  coords.forEach(pt => {
    minX = Math.min(minX, pt[0]);
    minY = Math.min(minY, pt[1]);
    maxX = Math.max(maxX, pt[0]);
    maxY = Math.max(maxY, pt[1]);
  });

  map.fitBounds([[minX, minY], [maxX, maxY]], { padding: 40, duration: 900 });
}

function flyToWholeState() {
  map.easeTo({ center: [75.7, 15.3], zoom: 6.5, duration: 900 });
}

// ---- Legend + Reset (minimal JS) ----
function generateLegend() {
  const legendEl = document.getElementById("mapLegend");
  if (!legendEl) return;

  legendEl.innerHTML = "";

  Object.entries(zoneColors).forEach(([zoneName, color]) => {
    const row = document.createElement("div");
    row.className = "map-legend-row";

    const swatch = document.createElement("span");
    swatch.className = "legend-swatch";
    swatch.style.backgroundColor = color;

    const label = document.createElement("span");
    label.textContent = zoneName;

    row.appendChild(swatch);
    row.appendChild(label);
    legendEl.appendChild(row);
  });
}

function hookResetButton() {
  const btn = document.getElementById("resetMapBtn");
  if (!btn) return;

  btn.addEventListener("click", () => {
    // Reset dropdowns
    const zoneSel = document.getElementById("zoneSelect");
    const projSel = document.getElementById("projectSelect");

    if (zoneSel) zoneSel.value = "all";
    if (projSel) projSel.value = "all";

    resetProjectDropdown();
    renderZoneChart();
    flyToWholeState();
  });
}

// Run once DOM & globals are ready
generateLegend();
hookResetButton();

// ------------------ MODAL ENGINE ------------------
let modalChartInstance = null;

function enableModal(chartId, chartTitle) {
  const canvas = document.getElementById(chartId);
  if (!canvas) return;

  canvas.style.cursor = "pointer";

  canvas.onclick = () => {
    const sourceChart = window[chartId];
    if (!sourceChart) return;

    document.getElementById("chartModal").style.display = "flex";
    document.getElementById("modalChartTitle").innerText = chartTitle;

    if (modalChartInstance) modalChartInstance.destroy();

    const ctx = document.getElementById("modalChart").getContext("2d");

    // Deep safe clone
    const clonedData = JSON.parse(JSON.stringify(sourceChart.data));
    const clonedOptions = JSON.parse(JSON.stringify(sourceChart.options));

    // Fix undefined values
    clonedData.datasets.forEach(ds => {
      ds.data = ds.data.map(v => Number(v) || 0);
    });

    // Override modal label formatting
    if (clonedOptions.plugins?.datalabels) {
      clonedOptions.plugins.datalabels.formatter = v =>
        Number(v) ? Number(v).toFixed(1) : "";
      clonedOptions.plugins.datalabels.font = { size: 16, weight: "bold" };
    }

    clonedOptions.responsive = true;
    clonedOptions.maintainAspectRatio = false;
    clonedOptions.animation = false;

    modalChartInstance = new Chart(ctx, {
      type: sourceChart.config.type,
      data: clonedData,
      options: clonedOptions,
      plugins: sourceChart.config.plugins ?? []
    });

    setTimeout(() => modalChartInstance.resize(), 100);
  };
}

// Close Modal
document.getElementById("closeModalBtn").onclick = () => {
  document.getElementById("chartModal").style.display = "none";
};

enableModal("areaChart", "Expanded View");


fetch("header.html")
  .then(res => res.text())
  .then(html => {
    document.getElementById("header-placeholder").innerHTML = html;

    // 🔥 After header loads, sidebar toggle finally works
    const menuBtn = document.getElementById("menu-btn");
    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content-wrapper");

    if (menuBtn) {
      menuBtn.addEventListener("click", () => {
        isOpen = !isOpen;
        sidebar.style.right = isOpen ? "0px" : "-240px";
        content.classList.toggle("sidebar-open", isOpen);
      });
    }
  });
  

</script>

</body>
</html>
