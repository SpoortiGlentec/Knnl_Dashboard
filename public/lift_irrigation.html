  <script>
    let isOpen = false;
    async function loadFiles() {
  const res = await fetch("/api/files");
  const files = await res.json();
  const container = document.getElementById("fileGrid");
  container.innerHTML = "";

  if (!files.length) {
    container.innerHTML = "<p>No Excel files found.</p>";
    return;
  }

  // 🔥 Map images to index (add more if needed)
  const tileImages = [
    "irrigation1.jpg",
    "irrigation2.jpg",
    "irrigation3.jpg"
  ];

  files.forEach((file, index) => {
    
    // pick image based on index (loops automatically)
    const imgSrc = tileImages[index % tileImages.length];

    const card = document.createElement("div");
    card.className = "dashboard-card";

    card.innerHTML = `
      <img src="${imgSrc}" alt="Project">
      <div class="card-overlay">
        <div class="card-icon">🚰</div>
        <div class="card-overlay-title">Lift Irrigation</div>
      </div>
      <div class="card-content">
        <div class="card-title">${file.replace(".xlsx","").replace(".xls","")}</div>
        <div class="card-subtitle">Tap to open project sheets</div>
        <div class="card-caption">View →</div>
      </div>
    `;
    
    card.onclick = () => loadSheets(file);
    container.appendChild(card);
  });
}


    document.querySelectorAll(".dashboard-card").forEach(card => {
  card.addEventListener("click", e => {
    const rect = card.getBoundingClientRect();
    const ripple = document.createElement("span");
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size+"px";
    ripple.style.left = e.clientX - rect.left - size/2 + "px";
    ripple.style.top = e.clientY - rect.top - size/2 + "px";
    ripple.classList.add("ripple-span");
    card.appendChild(ripple);
    ripple.addEventListener("animationend",()=>ripple.remove());
  });
});


    async function loadSheets(file) {
      const container = document.getElementById("fileGrid");
      const sheetSection = document.getElementById("sheetSection");
      const dataContainer = document.getElementById("dataContainer");

      container.style.display = "none";
      sheetSection.innerHTML = `<h2>${file.replace(".xlsx", "")}</h2><p>Select a project to view data:</p>`;
      dataContainer.innerHTML = "";

      const res = await fetch(`/api/sheets?file=${encodeURIComponent(file)}`);
      const sheets = await res.json();

      if (!sheets.length) {
        sheetSection.innerHTML += "<p class='no-data'>No sheets found.</p>";
        return;
      }

      sheets.forEach(sheet => {
        const btn = document.createElement("button");
        btn.className = "sheet-btn";
        btn.textContent = sheet;
        btn.onclick = () => loadData(file, sheet);
        sheetSection.appendChild(btn);
      });

      const back = document.createElement("button");
      back.className = "back-btn";
      back.textContent = "← Back to Files";
      back.onclick = () => {
        document.getElementById("sheetSection").innerHTML = "";
        dataContainer.innerHTML = "";
        container.style.display = "flex";
      };
      sheetSection.appendChild(back);
    }

    async function loadData(file, sheet) {
  const container = document.getElementById("dataContainer");
  container.innerHTML = "<p>Loading...</p>";

  const res = await fetch(`/api/data?file=${encodeURIComponent(file)}&sheet=${encodeURIComponent(sheet)}`);
  const data = await res.json();

  container.innerHTML = "";

  if (!data.length) {
    container.innerHTML = "<p class='no-data'>No data found in this sheet.</p>";
    return;
  }

  const card = document.createElement("div");
  card.className = "card";
  const table = document.createElement("table");

  const siRowIndex = data.findIndex(row =>
    row.some(cell => /SL.\s*NO.|SL.\s*NO|sl\s*no/i.test(cell))
  );
  const totalCols = data[siRowIndex]?.length || data[0].length;

  // Combine all top lines
  let infoText = "";
  for (let i = 0; i < siRowIndex; i++) {
    const line = data[i].filter(Boolean).join(" ").trim();
    if (/name of the project|status|name of the zone/i.test(line)) {
      infoText += " " + line;
    }
  }

  // 🧩 Normalize and fix formatting
  if (infoText) {
    // Add colon if missing (e.g. "Name of the Project Sunnal" → "Name of the Project: Sunnal")
    infoText = infoText
      .replace(/(Name of the Project)\s(?!:)/i, "$1: ")
      .replace(/(Status)\s(?!:)/i, "$1: ")
      .replace(/(Name of the Zone)\s(?!:)/i, "$1: ");

    // Insert line breaks between parts
    infoText = infoText
      .replace(/\s*Status\s*:/i, "<br>Status:")
      .replace(/\s*Name of the Zone\s*:/i, "<br>Name of the Zone:")
      .trim();

    // Clean extra spaces
    infoText = infoText.replace(/\s+/g, " ");

    const infoTr = document.createElement("tr");
    const infoTd = document.createElement("td");
    infoTd.colSpan = totalCols;
    infoTd.className = "info-header";
    infoTd.innerHTML = infoText;
    infoTr.appendChild(infoTd);
    table.appendChild(infoTr);
  }

  // Render the remaining table
  data.forEach((row, i) => {
    if (i < siRowIndex) return;
    const tr = document.createElement("tr");
    row.forEach(cell => {
      const td = document.createElement(i === siRowIndex ? "th" : "td");
      td.textContent = cell || "";
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });

  card.appendChild(table);
  container.appendChild(card);
}

    window.onload = loadFiles;

    // Fetch header from header.html
    fetch("header.html")
  .then(res => res.text())
  .then(html => {
    document.getElementById("header-placeholder").innerHTML = html;

    // 🔥 After header loads, sidebar toggle finally works
    const menuBtn = document.getElementById("menu-btn");
    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content-wrapper");

    if (menuBtn) {
      menuBtn.addEventListener("click", () => {
        isOpen = !isOpen;
        sidebar.style.right = isOpen ? "0px" : "-240px";
        content.classList.toggle("sidebar-open", isOpen);
      });
    }
  });
